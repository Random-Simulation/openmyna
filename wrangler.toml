name = "openmyna-switchboard"
main = "src/index.ts"
compatibility_date = "2025-01-29"

[dev]
port = 8787

# Custom domain route
[[routes]]
pattern = "switchboard.openmyna.com/*"
zone_name = "openmyna.com"

# D1 database for agent registry and message queue
[[d1_databases]]
binding = "DB"
database_name = "openmyna-db"
database_id = "0bf57280-27ed-4a40-948c-d972aaae20b6"

# KV for handshake rate limiting (1 per pair per 24h)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "99fc7a917f354d51a2bec0609863e01d"
